<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0a0d14"
    >

    <title>Time Between Friends</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <header class="page-heading">
            <p>Three friends. Three time zones.</p>
        </header>

        <section class="clock-grid">

            <article
                class="clock-card"
                data-time-zone="America/Los_Angeles"
            >

                <h2>Portland</h2>

                <div class="analog-clock">

                    <div class="clock-markers"></div>

                    <div class="clock-hand hour-hand"></div>
                    <div class="clock-hand minute-hand"></div>
                    <div class="clock-hand second-hand"></div>

                    <div class="clock-emoji" aria-hidden="true">
                        🦊
                    </div>

                </div>

                <div class="digital-time">
                    --:--:--
                </div>

                <div class="local-date">
                    Loading date…
                </div>

                <div class="time-zone-label">
                    Pacific Time
                </div>

            </article>

            <article
                class="clock-card"
                data-time-zone="America/Toronto"
            >

                <h2>Saint-Eustache</h2>

                <div class="analog-clock">

                    <div class="clock-markers"></div>

                    <div class="clock-hand hour-hand"></div>
                    <div class="clock-hand minute-hand"></div>
                    <div class="clock-hand second-hand"></div>

                    <div class="clock-emoji" aria-hidden="true">
                        🥦
                    </div>

                </div>

                <div class="digital-time">
                    --:--:--
                </div>

                <div class="local-date">
                    Loading date…
                </div>

                <div class="time-zone-label">
                    Eastern Time
                </div>

            </article>

            <article
                class="clock-card"
                data-time-zone="Australia/Perth"
            >

                <h2>Manjimup</h2>

                <div class="analog-clock">

                    <div class="clock-markers"></div>

                    <div class="clock-hand hour-hand"></div>
                    <div class="clock-hand minute-hand"></div>
                    <div class="clock-hand second-hand"></div>

                    <div class="clock-emoji" aria-hidden="true">
                        🦈
                    </div>

                </div>

                <div class="digital-time">
                    --:--:--
                </div>

                <div class="local-date">
                    Loading date…
                </div>

                <div class="time-zone-label">
                    Western Australia Time
                </div>

            </article>

        </section>

    </main>

    <script src="clock.js"></script>

</body>
</html>
